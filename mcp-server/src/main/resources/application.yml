# Using spring-ai-starter-mcp-server
spring:
  application:
    name: mcp-server
  main:
    web-application-type: none
    banner-mode: "off"
  ai:
    mcp:
      server:
        name: stdio-mcp-server
        version: 1.0.0
        type: SYNC
        stdio: true

logging:
  console:
    enabled: false
  file:
    name: logs/mcp-server.log